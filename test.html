<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive life story told through minimalist pencil line art and horizontal scrolling">
  <title>Life Journey Timeline - Interactive Story</title>
  
  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #fafafa;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-size: 18px;
      color: #2c2c2c;
      margin-top: 20px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #e0e0e0;
      border-top: 3px solid #2c2c2c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateY(-50%) scale(1); }
      50% { opacity: 0.8; transform: translateY(-50%) scale(1.2); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(44, 44, 44, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(44, 44, 44, 0.8)); }
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes trail {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @media (max-width: 768px) {
      .loading-text {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }

    .milestone-marker {
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .milestone-marker:hover {
      transform: scale(1.3);
      filter: drop-shadow(0 4px 8px rgba(44, 44, 44, 0.3));
    }

    .milestone-marker:active {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Drawing your journey...</div>
  </div>

  <!-- React App Root -->
  <div id="root"></div>

  <!-- The Life Journey Component -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================
    // MILESTONE DATA - CUSTOMIZE YOUR STORY HERE
    // ============================================
    const milestonesData = [
      {
        age: 0,
        title: "Beginning",
        description: "The story begins...",
        type: "birth",
        icon: "star",
        position: 0
      },
      {
        age: 4,
        title: "Move from Kabul to India",
        description: "Our family permanently moved from Kabul, Afghanistan to New Delhi, India. A life-changing journey across borders.",
        type: "move",
        from: { city: "Kabul", country: "Afghanistan" },
        to: { city: "New Delhi", country: "India" },
        icon: "airplane",
        position: 1200
      },
      {
        age: 8,
        title: "First Day of School",
        description: "Started elementary education in New Delhi. Made lifelong friends and discovered a love for learning.",
        type: "education",
        icon: "book",
        position: 2400
      },
      {
        age: 12,
        title: "Discovered Programming",
        description: "Wrote my first computer program in BASIC. Fell in love with creating things through code.",
        type: "achievement",
        icon: "code",
        position: 3600
      },
      {
        age: 16,
        title: "High School Graduation",
        description: "Graduated with honors, ready for the next chapter. Excited about the future and endless possibilities.",
        type: "education",
        icon: "graduation",
        position: 4800
      },
      {
        age: 18,
        title: "University Life Begins",
        description: "Started studying Computer Science. A new adventure in learning and growth.",
        type: "education",
        icon: "university",
        position: 6000
      }
    ];

    // ============================================
    // SVG ICON COMPONENTS
    // ============================================
    
    // Solid filled airplane silhouette - inspired by reference image
    const AirplaneIcon = ({ x, y, rotation = 0, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rotation}) scale(${scale})`}>
        {/* Main body/fuselage as solid shape */}
        <path 
          d="M -8,-2 L 15,-1 L 18,0 L 15,1 L -8,2 Z" 
          fill="#2c2c2c"
        />
        
        {/* Wings - solid filled */}
        <path 
          d="M -5,-2 L -12,-12 L -2,-14 L 3,-2 Z" 
          fill="#2c2c2c"
        />
        <path 
          d="M -5,2 L -12,12 L -2,14 L 3,2 Z" 
          fill="#2c2c2c"
        />
        
        {/* Tail fin - solid filled */}
        <path 
          d="M -8,-2 L -15,-6 L -12,-1 L -15,6 L -8,2 Z" 
          fill="#2c2c2c"
        />
        
        {/* Tail stabilizers */}
        <path 
          d="M -10,-2 L -16,-8 L -11,-3" 
          fill="#2c2c2c"
        />
        <path 
          d="M -10,2 L -16,8 L -11,3" 
          fill="#2c2c2c"
        />
      </g>
    );

    const BookIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`} className="milestone-icon">
        <rect x="-12" y="-15" width="24" height="30" stroke="#2c2c2c" strokeWidth="1.5" fill="none" rx="2" />
        <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#2c2c2c" strokeWidth="1" />
        <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#2c2c2c" strokeWidth="1" />
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#2c2c2c" strokeWidth="1" />
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#2c2c2c" strokeWidth="1.5" />
      </g>
    );

    const StarIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`} className="milestone-icon">
        <path
          d="M 0,-15 L 4,-5 L 15,-5 L 7,2 L 10,13 L 0,6 L -10,13 L -7,2 L -15,-5 L -4,-5 Z"
          stroke="#2c2c2c"
          strokeWidth="1.5"
          fill="none"
          strokeLinejoin="round"
        />
        <circle cx="0" cy="0" r="3" fill="none" stroke="#2c2c2c" strokeWidth="1" />
      </g>
    );

    const CodeIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`} className="milestone-icon">
        <path d="M -15,-10 L -5,0 L -15,10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        <path d="M 15,-10 L 5,0 L 15,10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        <line x1="-2" y1="-12" x2="2" y2="12" stroke="#2c2c2c" strokeWidth="1.5" strokeLinecap="round" />
        <circle cx="0" cy="-15" r="2" fill="#2c2c2c" />
        <circle cx="0" cy="15" r="2" fill="#2c2c2c" />
      </g>
    );

    const GraduationIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`} className="milestone-icon">
        <path d="M -15,-8 L 0,-15 L 15,-8 L 15,0 L 0,7 L -15,0 Z" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinejoin="round" />
        <line x1="0" y1="7" x2="0" y2="15" stroke="#2c2c2c" strokeWidth="1.5" strokeLinecap="round" />
        <rect x="-5" y="13" width="10" height="3" stroke="#2c2c2c" strokeWidth="1.5" fill="none" />
        <line x1="15" y1="0" x2="15" y2="10" stroke="#2c2c2c" strokeWidth="1.5" />
        <circle cx="15" cy="12" r="2" fill="none" stroke="#2c2c2c" strokeWidth="1.5" />
      </g>
    );

    const UniversityIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`} className="milestone-icon">
        <rect x="-15" y="-10" width="30" height="25" stroke="#2c2c2c" strokeWidth="1.5" fill="none" />
        <path d="M -15,-10 L 0,-18 L 15,-10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinejoin="round" />
        <rect x="-10" y="0" width="6" height="15" stroke="#2c2c2c" strokeWidth="1.2" fill="none" />
        <rect x="4" y="0" width="6" height="15" stroke="#2c2c2c" strokeWidth="1.2" fill="none" />
        <line x1="-18" y1="15" x2="18" y2="15" stroke="#2c2c2c" strokeWidth="1.5" />
      </g>
    );

    const PinIcon = ({ x, y, label }) => (
      <g transform={`translate(${x}, ${y})`}>
        {/* Solid filled pin like in reference image */}
        <path 
          d="M 0,-20 Q -12,-20 -12,-8 Q -12,0 0,15 Q 12,0 12,-8 Q 12,-20 0,-20 Z" 
          fill="#2c2c2c"
        />
        <circle cx="0" cy="-8" r="5" fill="#fafafa" />
        {label && (
          <text x="0" y="35" fontSize="14" textAnchor="middle" fill="#2c2c2c" fontFamily="'Courier New', monospace" fontWeight="bold">
            {label}
          </text>
        )}
      </g>
    );

    // Simplified Afghanistan outline
    const AfghanistanMap = ({ x, y, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) scale(${scale})`}>
        <path
          d="M 0,20 L 15,10 L 35,8 L 55,15 L 65,8 L 75,12 L 85,8 L 95,15 L 100,25 L 95,40 L 85,50 L 70,55 L 50,52 L 30,45 L 15,35 L 5,28 Z"
          stroke="#2c2c2c"
          strokeWidth="2"
          fill="rgba(44, 44, 44, 0.05)"
          strokeLinejoin="round"
        />
      </g>
    );

    // Simplified India outline
    const IndiaMap = ({ x, y, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) scale(${scale})`}>
        <path
          d="M 40,0 L 55,5 L 65,15 L 70,30 L 75,50 L 70,70 L 65,90 L 55,110 L 45,125 L 35,135 L 25,125 L 20,110 L 15,90 L 10,70 L 15,50 L 20,30 L 30,15 L 35,5 Z M 25,140 L 20,145 L 25,150"
          stroke="#2c2c2c"
          strokeWidth="2"
          fill="rgba(44, 44, 44, 0.05)"
          strokeLinejoin="round"
        />
      </g>
    );

    // Cloud decoration
    const Cloud = ({ x, y, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) scale(${scale})`} opacity="0.3">
        <ellipse cx="0" cy="0" rx="15" ry="8" fill="none" stroke="#2c2c2c" strokeWidth="1" />
        <ellipse cx="-10" cy="2" rx="10" ry="6" fill="none" stroke="#2c2c2c" strokeWidth="1" />
        <ellipse cx="10" cy="2" rx="10" ry="6" fill="none" stroke="#2c2c2c" strokeWidth="1" />
      </g>
    );

    // ============================================
    // MAIN COMPONENT
    // ============================================
    const LifeJourneyTimeline = () => {
      const [scrollProgress, setScrollProgress] = useState(0);
      const [selectedMilestone, setSelectedMilestone] = useState(null);
      const [showHint, setShowHint] = useState(true);
      const [reducedMotion, setReducedMotion] = useState(false);
      const [hoveredMilestone, setHoveredMilestone] = useState(null);
      const containerRef = useRef(null);
      const maxScroll = 6500;

      useEffect(() => {
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReducedMotion(mediaQuery.matches);

        const hintTimer = setTimeout(() => setShowHint(false), 3000);

        setTimeout(() => {
          const loadingEl = document.getElementById('loading');
          if (loadingEl) loadingEl.classList.add('hidden');
        }, 500);

        return () => clearTimeout(hintTimer);
      }, []);

      useEffect(() => {
        const handleWheel = (e) => {
          e.preventDefault();
          const delta = e.deltaY;
          setScrollProgress((prev) => {
            const newProgress = prev + delta * 0.5;
            return Math.max(0, Math.min(maxScroll, newProgress));
          });
        };

        const container = containerRef.current;
        if (container) {
          container.addEventListener('wheel', handleWheel, { passive: false });
        }

        return () => {
          if (container) {
            container.removeEventListener('wheel', handleWheel);
          }
        };
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (selectedMilestone !== null) {
            if (e.key === 'Escape') {
              setSelectedMilestone(null);
            }
            return;
          }

          if (e.key === 'ArrowRight') {
            setScrollProgress((prev) => Math.min(maxScroll, prev + 100));
          } else if (e.key === 'ArrowLeft') {
            setScrollProgress((prev) => Math.max(0, prev - 100));
          } else if (e.key === 'Enter') {
            const closest = milestonesData.reduce((prev, curr) => 
              Math.abs(curr.position - scrollProgress) < Math.abs(prev.position - scrollProgress) ? curr : prev
            );
            if (Math.abs(closest.position - scrollProgress) < 200) {
              setSelectedMilestone(closest);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [scrollProgress, selectedMilestone]);

      // Generate the journey path
      const generatePath = () => {
        let path = "M 100 300";
        path += " L 800 280 Q 1000 270 1200 300";
        path += " Q 1400 350 1600 320 Q 1800 290 2000 310";
        path += " L 2400 300 Q 2600 290 2800 310 L 3600 305";
        path += " Q 3800 300 4000 320 L 4800 315";
        path += " Q 5000 310 5200 300 L 6000 295 L 6500 290";
        return path;
      };

      const journeyPath = generatePath();
      const pathLength = 7000;
      const drawProgress = (scrollProgress / maxScroll) * pathLength;

      // Calculate airplane position - CIRCULAR LOOP like reference image
      const airplaneProgress = Math.max(0, Math.min(1, (scrollProgress - 1000) / 1000));
      
      // Create circular loop motion
      const loopCenterX = 1600;
      const loopCenterY = 250;
      const loopRadius = 120;
      const angle = airplaneProgress * Math.PI * 2; // Full circle
      
      const airplaneX = loopCenterX + Math.cos(angle) * loopRadius;
      const airplaneY = loopCenterY + Math.sin(angle) * loopRadius;
      const airplaneRotation = (angle * 180 / Math.PI) + 90;

      // Generate dotted loop path like in reference image
      const generateLoopPath = () => {
        const points = [];
        for (let i = 0; i <= 360; i += 5) {
          const rad = (i * Math.PI) / 180;
          const x = loopCenterX + Math.cos(rad) * loopRadius;
          const y = loopCenterY + Math.sin(rad) * loopRadius;
          points.push(`${i === 0 ? 'M' : 'L'} ${x} ${y}`);
        }
        return points.join(' ') + ' Z';
      };

      const getIconComponent = (icon) => {
        switch (icon) {
          case 'airplane': return AirplaneIcon;
          case 'book': return BookIcon;
          case 'star': return StarIcon;
          case 'code': return CodeIcon;
          case 'graduation': return GraduationIcon;
          case 'university': return UniversityIcon;
          default: return StarIcon;
        }
      };

      const progressPercent = Math.round((scrollProgress / maxScroll) * 100);

      return (
        <div 
          ref={containerRef}
          className="life-journey-container"
          role="application"
          aria-label="Interactive life journey timeline"
          style={{
            width: '100vw',
            height: '100vh',
            overflow: 'hidden',
            background: 'linear-gradient(to bottom, #fafafa 0%, #f0f0f0 100%)',
            position: 'relative',
            cursor: 'grab',
            fontFamily: "'Courier New', monospace"
          }}
        >
          {/* Hint overlay */}
          {showHint && (
            <div 
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                background: 'rgba(250, 250, 250, 0.95)',
                padding: '30px 50px',
                border: '2px solid #2c2c2c',
                borderRadius: '12px',
                zIndex: 1000,
                animation: 'fadeOut 3s forwards',
                fontSize: '18px',
                textAlign: 'center',
                boxShadow: '0 8px 16px rgba(0,0,0,0.1)'
              }}
            >
              <div style={{ marginBottom: '10px', fontSize: '32px', animation: 'bounce 1s infinite' }}>✈️</div>
              <strong>Scroll to travel the line</strong>
              <div style={{ fontSize: '14px', marginTop: '10px', opacity: 0.7 }}>
                Use ← → arrow keys • Click milestones for details
              </div>
            </div>
          )}

          {/* Progress indicator */}
          <div 
            style={{
              position: 'absolute',
              top: '20px',
              right: '20px',
              fontSize: '16px',
              color: '#2c2c2c',
              background: 'rgba(250, 250, 250, 0.95)',
              padding: '12px 24px',
              border: '2px solid #2c2c2c',
              borderRadius: '8px',
              zIndex: 100,
              boxShadow: '0 4px 8px rgba(0,0,0,0.1)',
              fontWeight: 'bold'
            }}
          >
            📍 Progress: {progressPercent}%
          </div>

          {/* Scroll cue chevrons */}
          <div 
            style={{
              position: 'absolute',
              right: '30px',
              top: '50%',
              transform: 'translateY(-50%)',
              fontSize: '48px',
              color: '#2c2c2c',
              opacity: scrollProgress < 100 ? 0.5 : 0,
              transition: 'opacity 0.5s',
              animation: scrollProgress < 100 ? 'pulse 2s infinite' : 'none',
              fontWeight: 'bold'
            }}
          >
            ‹‹
          </div>

          {/* Main SVG Canvas */}
          <svg 
            width="100%" 
            height="100%" 
            viewBox="0 0 1400 700"
            preserveAspectRatio="xMidYMid slice"
            style={{
              filter: 'url(#pencilTexture)'
            }}
          >
            <defs>
              {/* Pencil texture filter */}
              <filter id="pencilTexture">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" />
              </filter>

              {/* Glow effect for active elements */}
              <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                  <feMergeNode in="coloredBlur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            {/* Background elements that move with scroll */}
            <g transform={`translate(${-scrollProgress * 0.1}, 0)`}>
              {/* Subtle grid lines */}
              {[...Array(20)].map((_, i) => (
                <line 
                  key={i}
                  x1={i * 400}
                  y1="0"
                  x2={i * 400}
                  y2="700"
                  stroke="#e0e0e0"
                  strokeWidth="0.5"
                  opacity="0.3"
                />
              ))}
            </g>

            {/* Decorative clouds */}
            <g transform={`translate(${-scrollProgress * 0.15}, 0)`}>
              <Cloud x={300} y={100} scale={0.8} />
              <Cloud x={800} y={150} scale={1.2} />
              <Cloud x={1500} y={80} scale={1} />
              <Cloud x={2200} y={120} scale={0.9} />
              <Cloud x={3000} y={100} scale={1.1} />
              <Cloud x={4000} y={90} scale={0.85} />
            </g>

            {/* Main content group that moves with scroll */}
            <g transform={`translate(${-scrollProgress}, 0)`}>
              {/* The journey line - DASHED like reference */}
              <path
                d={journeyPath}
                stroke="#2c2c2c"
                strokeWidth="3"
                fill="none"
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeDasharray="15 10"
                opacity="0.7"
              />

              {/* Animated drawing overlay - dashed */}
              <path
                d={journeyPath}
                stroke="#2c2c2c"
                strokeWidth="3"
                fill="none"
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeDasharray={`15 10 ${pathLength}`}
                strokeDashoffset={reducedMotion ? 0 : Math.max(0, pathLength - drawProgress + 25)}
                style={{
                  transition: reducedMotion ? 'none' : 'stroke-dashoffset 0.1s ease-out'
                }}
              />

              {/* Afghanistan and India maps during the travel segment */}
              {scrollProgress > 900 && scrollProgress < 2200 && (
                <>
                  <g style={{ animation: 'float 3s ease-in-out infinite' }}>
                    <AfghanistanMap x={950} y={150} scale={0.8} />
                    <PinIcon x={1000} y={200} label="Kabul" />
                  </g>
                  
                  <g style={{ animation: 'float 3s ease-in-out infinite 1.5s' }}>
                    <IndiaMap x={1700} y={100} scale={1} />
                    <PinIcon x={1765} y={180} label="New Delhi" />
                  </g>

                  {/* DOTTED LOOP PATH - like reference image */}
                  {!reducedMotion && scrollProgress > 1000 && scrollProgress < 2000 && (
                    <>
                      {/* Main dotted loop path */}
                      <path 
                        d={generateLoopPath()}
                        stroke="#555" 
                        strokeWidth="3" 
                        strokeDasharray="12 8"
                        fill="none" 
                        opacity="0.6"
                      />
                      
                      {/* Progress on the loop - shows completed portion */}
                      <path 
                        d={generateLoopPath()}
                        stroke="#2c2c2c" 
                        strokeWidth="3" 
                        strokeDasharray="12 8"
                        fill="none" 
                        strokeDashoffset={-airplaneProgress * (loopRadius * 2 * Math.PI)}
                        opacity="0.8"
                      />

                      {/* Dotted line from Kabul to loop start */}
                      <line 
                        x1={1000} 
                        y1={215} 
                        x2={loopCenterX - loopRadius} 
                        y2={loopCenterY}
                        stroke="#555"
                        strokeWidth="3"
                        strokeDasharray="12 8"
                        opacity="0.5"
                      />

                      {/* Dotted line from loop to India */}
                      <line 
                        x1={loopCenterX + loopRadius} 
                        y1={loopCenterY} 
                        x2={1765} 
                        y2={195}
                        stroke="#555"
                        strokeWidth="3"
                        strokeDasharray="12 8"
                        opacity="0.5"
                      />
                      
                      {/* SOLID FILLED AIRPLANE with glow - like reference image */}
                      <g style={{ animation: 'glow 2s ease-in-out infinite', filter: 'drop-shadow(0 0 8px rgba(44,44,44,0.6))' }}>
                        <AirplaneIcon 
                          x={airplaneX} 
                          y={airplaneY} 
                          rotation={airplaneRotation}
                          scale={2.2}
                        />
                      </g>

                      {/* Trail effect behind airplane */}
                      {[...Array(5)].map((_, i) => {
                        const trailAngle = angle - (i * 0.15);
                        const trailX = loopCenterX + Math.cos(trailAngle) * loopRadius;
                        const trailY = loopCenterY + Math.sin(trailAngle) * loopRadius;
                        const trailOpacity = 0.3 - (i * 0.06);
                        return (
                          <circle 
                            key={i}
                            cx={trailX} 
                            cy={trailY} 
                            r={3 - i * 0.4} 
                            fill="#2c2c2c" 
                            opacity={trailOpacity}
                          />
                        );
                      })}

                      {/* Decorative clouds around the loop */}
                      <Cloud x={loopCenterX - 180} y={loopCenterY - 60} scale={0.6} />
                      <Cloud x={loopCenterX + 160} y={loopCenterY + 70} scale={0.7} />
                    </>
                  )}
                </>
              )}

              {/* Milestone markers */}
              {milestonesData.map((milestone, index) => {
                const IconComponent = getIconComponent(milestone.icon);
                const isVisible = Math.abs(milestone.position - scrollProgress) < 800;
                const isNear = Math.abs(milestone.position - scrollProgress) < 200;
                const isHovered = hoveredMilestone === index;

                return (
                  <g key={index}>
                    {isVisible && (
                      <g 
                        className="milestone-marker"
                        transform={`translate(${milestone.position}, ${295})`}
                        style={{ 
                          opacity: isNear ? 1 : 0.6,
                          transition: 'all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)',
                          cursor: 'pointer',
                        }}
                        onClick={() => setSelectedMilestone(milestone)}
                        onMouseEnter={() => setHoveredMilestone(index)}
                        onMouseLeave={() => setHoveredMilestone(null)}
                      >
                        {/* Glow circle on hover */}
                        {isHovered && (
                          <circle 
                            cx="0" 
                            cy="-30" 
                            r="25" 
                            fill="rgba(44, 44, 44, 0.1)" 
                            style={{ animation: 'bounce 0.5s' }}
                          />
                        )}

                        {/* Connection line - DASHED */}
                        <line 
                          x1="0" 
                          y1="5" 
                          x2="0" 
                          y2="60" 
                          stroke="#2c2c2c" 
                          strokeWidth={isHovered ? "2.5" : "1.5"}
                          strokeDasharray="6 4"
                          style={{ transition: 'all 0.3s' }}
                        />
                        
                        <IconComponent x={0} y={-30} />
                        
                        {/* Age label with background */}
                        <g>
                          <rect 
                            x="-20" 
                            y="65" 
                            width="40" 
                            height="22" 
                            rx="4"
                            fill={isHovered ? "#2c2c2c" : "rgba(250, 250, 250, 0.9)"}
                            stroke="#2c2c2c"
                            strokeWidth="1.5"
                            style={{ transition: 'all 0.3s' }}
                          />
                          <text 
                            x="0" 
                            y="80" 
                            fontSize="14" 
                            textAnchor="middle" 
                            fill={isHovered ? "#fafafa" : "#2c2c2c"}
                            fontWeight="bold"
                            style={{ transition: 'all 0.3s' }}
                          >
                            Age {milestone.age}
                          </text>
                        </g>

                        {/* Title */}
                        {(isNear || isHovered) && (
                          <text 
                            x="0" 
                            y="105" 
                            fontSize="13" 
                            textAnchor="middle" 
                            fill="#2c2c2c"
                            fontWeight="bold"
                            style={{ animation: isHovered ? 'float 1s ease-in-out infinite' : 'none' }}
                          >
                            {milestone.title}
                          </text>
                        )}

                        {/* Interactive hint */}
                        {isHovered && (
                          <text 
                            x="0" 
                            y="125" 
                            fontSize="10" 
                            textAnchor="middle" 
                            fill="#555"
                            style={{ animation: 'fadeOut 2s forwards' }}
                          >
                            Click for details
                          </text>
                        )}
                      </g>
                    )}
                  </g>
                );
              })}
            </g>
          </svg>

          {/* Timeline navigator */}
          <div 
            style={{
              position: 'absolute',
              bottom: '30px',
              left: '50%',
              transform: 'translateX(-50%)',
              width: '80%',
              maxWidth: '800px',
              height: '50px',
              background: 'rgba(250, 250, 250, 0.95)',
              border: '2px solid #2c2c2c',
              borderRadius: '12px',
              padding: '10px 20px',
              display: 'flex',
              alignItems: 'center',
              zIndex: 100,
              boxShadow: '0 8px 16px rgba(0,0,0,0.1)'
            }}
          >
            <div style={{ flex: 1, position: 'relative', height: '12px', background: '#e0e0e0', borderRadius: '6px', overflow: 'hidden' }}>
              {/* Progress bar with gradient */}
              <div 
                style={{
                  position: 'absolute',
                  left: 0,
                  top: 0,
                  height: '100%',
                  width: `${progressPercent}%`,
                  background: 'linear-gradient(90deg, #2c2c2c 0%, #555 100%)',
                  borderRadius: '6px',
                  transition: 'width 0.2s ease-out',
                  boxShadow: '0 2px 4px rgba(0,0,0,0.2)'
                }}
              />
              
              {/* Milestone ticks with hover effect */}
              {milestonesData.map((milestone, index) => (
                <div
                  key={index}
                  style={{
                    position: 'absolute',
                    left: `${(milestone.position / maxScroll) * 100}%`,
                    top: '-6px',
                    width: '3px',
                    height: '24px',
                    background: '#2c2c2c',
                    cursor: 'pointer',
                    borderRadius: '2px',
                    transition: 'all 0.2s',
                    transform: hoveredMilestone === index ? 'scaleY(1.3)' : 'scaleY(1)'
                  }}
                  onClick={() => setScrollProgress(milestone.position)}
                  onMouseEnter={() => setHoveredMilestone(index)}
                  onMouseLeave={() => setHoveredMilestone(null)}
                  title={`Age ${milestone.age}: ${milestone.title}`}
                />
              ))}

              {/* Draggable handle with shadow */}
              <div
                style={{
                  position: 'absolute',
                  left: `${progressPercent}%`,
                  top: '50%',
                  transform: 'translate(-50%, -50%)',
                  width: '24px',
                  height: '24px',
                  background: 'linear-gradient(135deg, #2c2c2c 0%, #555 100%)',
                  borderRadius: '50%',
                  cursor: 'grab',
                  border: '3px solid #fafafa',
                  boxShadow: '0 4px 8px rgba(0,0,0,0.3)',
                  transition: 'transform 0.2s'
                }}
                onMouseDown={(e) => {
                  e.currentTarget.style.cursor = 'grabbing';
                  e.currentTarget.style.transform = 'translate(-50%, -50%) scale(1.1)';
                }}
                onMouseUp={(e) => {
                  e.currentTarget.style.cursor = 'grab';
                  e.currentTarget.style.transform = 'translate(-50%, -50%) scale(1)';
                }}
              />
            </div>
          </div>

          {/* Milestone detail card */}
          {selectedMilestone && (
            <>
              {/* Backdrop */}
              <div 
                style={{
                  position: 'absolute',
                  top: 0,
                  left: 0,
                  width: '100%',
                  height: '100%',
                  background: 'rgba(0, 0, 0, 0.5)',
                  zIndex: 999,
                  animation: 'fadeOut 0.3s reverse'
                }}
                onClick={() => setSelectedMilestone(null)}
              />
              
              {/* Card */}
              <div 
                style={{
                  position: 'absolute',
                  top: '50%',
                  left: '50%',
                  transform: 'translate(-50%, -50%)',
                  background: '#fafafa',
                  border: '3px solid #2c2c2c',
                  borderRadius: '16px',
                  padding: '35px',
                  maxWidth: '450px',
                  width: '90%',
                  zIndex: 1000,
                  boxShadow: '0 20px 40px rgba(0,0,0,0.3)',
                  animation: 'bounce 0.5s'
                }}
                role="dialog"
                aria-labelledby="milestone-title"
              >
                <button
                  onClick={() => setSelectedMilestone(null)}
                  style={{
                    position: 'absolute',
                    top: '15px',
                    right: '15px',
                    background: '#2c2c2c',
                    color: '#fafafa',
                    border: 'none',
                    fontSize: '24px',
                    cursor: 'pointer',
                    padding: '5px 12px',
                    borderRadius: '50%',
                    width: '40px',
                    height: '40px',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    transition: 'all 0.2s'
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.transform = 'rotate(90deg) scale(1.1)';
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.transform = 'rotate(0deg) scale(1)';
                  }}
                  aria-label="Close"
                >
                  ×
                </button>
                
                <div style={{ marginBottom: '10px', fontSize: '36px' }}>
                  {selectedMilestone.icon === 'airplane' && '✈️'}
                  {selectedMilestone.icon === 'book' && '📚'}
                  {selectedMilestone.icon === 'star' && '⭐'}
                  {selectedMilestone.icon === 'code' && '💻'}
                  {selectedMilestone.icon === 'graduation' && '🎓'}
                  {selectedMilestone.icon === 'university' && '🏛️'}
                </div>

                <h2 id="milestone-title" style={{ marginTop: 0, fontSize: '28px', color: '#2c2c2c' }}>
                  Age {selectedMilestone.age}
                </h2>
                <h3 style={{ fontSize: '20px', color: '#555', marginTop: '8px', marginBottom: '15px' }}>
                  {selectedMilestone.title}
                </h3>
                <p style={{ fontSize: '16px', lineHeight: '1.8', color: '#2c2c2c', marginTop: '15px' }}>
                  {selectedMilestone.description}
                </p>
                
                {selectedMilestone.from && selectedMilestone.to && (
                  <div style={{ 
                    marginTop: '25px', 
                    padding: '20px', 
                    background: 'linear-gradient(135deg, #f0f0f0 0%, #e8e8e8 100%)', 
                    borderRadius: '10px',
                    border: '2px solid #e0e0e0'
                  }}>
                    <div style={{ fontSize: '15px', color: '#555', marginBottom: '8px' }}>
                      <strong>📍 From:</strong> {selectedMilestone.from.city}, {selectedMilestone.from.country}
                    </div>
                    <div style={{ fontSize: '15px', color: '#555' }}>
                      <strong>📍 To:</strong> {selectedMilestone.to.city}, {selectedMilestone.to.country}
                    </div>
                  </div>
                )}
              </div>
            </>
          )}
        </div>
      );
    };

    // Render the app
    ReactDOM.createRoot(document.getElementById('root')).render(<LifeJourneyTimeline />);
  </script>
</body>
</html>
