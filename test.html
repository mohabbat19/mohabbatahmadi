<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An interactive life story told through minimalist pencil line art and horizontal scrolling">
  <title>Life Journey Timeline - Interactive Story</title>
  
  <!-- React and ReactDOM from CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #fafafa;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
    }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-size: 18px;
      color: #2c2c2c;
      margin-top: 20px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid #e0e0e0;
      border-top: 3px solid #2c2c2c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    @media (max-width: 768px) {
      .loading-text {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Drawing your journey...</div>
  </div>

  <!-- React App Root -->
  <div id="root"></div>

  <!-- The Life Journey Component -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================
    // MILESTONE DATA - CUSTOMIZE YOUR STORY HERE
    // ============================================
    const milestonesData = [
      {
        age: 0,
        title: "Beginning",
        description: "The story begins...",
        type: "birth",
        icon: "star",
        position: 0
      },
      {
        age: 4,
        title: "Move from Kabul to India",
        description: "Our family permanently moved from Kabul, Afghanistan to New Delhi, India. A life-changing journey across borders.",
        type: "move",
        from: { city: "Kabul", country: "Afghanistan" },
        to: { city: "New Delhi", country: "India" },
        icon: "airplane",
        position: 1200
      },
      {
        age: 8,
        title: "First Day of School",
        description: "Started elementary education in New Delhi. Made lifelong friends and discovered a love for learning.",
        type: "education",
        icon: "book",
        position: 2400
      },
      {
        age: 12,
        title: "Discovered Programming",
        description: "Wrote my first computer program in BASIC. Fell in love with creating things through code.",
        type: "achievement",
        icon: "code",
        position: 3600
      },
      {
        age: 16,
        title: "High School Graduation",
        description: "Graduated with honors, ready for the next chapter. Excited about the future and endless possibilities.",
        type: "education",
        icon: "graduation",
        position: 4800
      },
      {
        age: 18,
        title: "University Life Begins",
        description: "Started studying Computer Science. A new adventure in learning and growth.",
        type: "education",
        icon: "university",
        position: 6000
      }
    ];

    // ============================================
    // SVG ICON COMPONENTS
    // ============================================
    const AirplaneIcon = ({ x, y, rotation = 0, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) rotate(${rotation}) scale(${scale})`}>
        <path
          d="M -20,-2 L -15,-5 L 10,-3 L 18,0 L 10,3 L -15,5 L -20,2 M 0,-8 L 0,8 M 10,-6 L 15,-4 M 10,6 L 15,4"
          stroke="#2c2c2c"
          strokeWidth="1.5"
          fill="none"
          strokeLinecap="round"
          strokeLinejoin="round"
        />
      </g>
    );

    const BookIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`}>
        <rect x="-12" y="-15" width="24" height="30" stroke="#2c2c2c" strokeWidth="1.5" fill="none" rx="2" />
        <line x1="-12" y1="-10" x2="12" y2="-10" stroke="#2c2c2c" strokeWidth="1" />
        <line x1="-12" y1="-5" x2="12" y2="-5" stroke="#2c2c2c" strokeWidth="1" />
        <line x1="0" y1="-15" x2="0" y2="15" stroke="#2c2c2c" strokeWidth="1.5" />
      </g>
    );

    const StarIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`}>
        <path
          d="M 0,-15 L 4,-5 L 15,-5 L 7,2 L 10,13 L 0,6 L -10,13 L -7,2 L -15,-5 L -4,-5 Z"
          stroke="#2c2c2c"
          strokeWidth="1.5"
          fill="none"
          strokeLinejoin="round"
        />
      </g>
    );

    const CodeIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`}>
        <path d="M -15,-10 L -5,0 L -15,10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        <path d="M 15,-10 L 5,0 L 15,10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
        <line x1="-2" y1="-12" x2="2" y2="12" stroke="#2c2c2c" strokeWidth="1.5" strokeLinecap="round" />
      </g>
    );

    const GraduationIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`}>
        <path d="M -15,-8 L 0,-15 L 15,-8 L 15,0 L 0,7 L -15,0 Z" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinejoin="round" />
        <line x1="0" y1="7" x2="0" y2="15" stroke="#2c2c2c" strokeWidth="1.5" strokeLinecap="round" />
        <rect x="-5" y="13" width="10" height="3" stroke="#2c2c2c" strokeWidth="1.5" fill="none" />
      </g>
    );

    const UniversityIcon = ({ x, y }) => (
      <g transform={`translate(${x}, ${y})`}>
        <rect x="-15" y="-10" width="30" height="25" stroke="#2c2c2c" strokeWidth="1.5" fill="none" />
        <path d="M -15,-10 L 0,-18 L 15,-10" stroke="#2c2c2c" strokeWidth="1.5" fill="none" strokeLinejoin="round" />
        <rect x="-10" y="0" width="6" height="15" stroke="#2c2c2c" strokeWidth="1.2" fill="none" />
        <rect x="4" y="0" width="6" height="15" stroke="#2c2c2c" strokeWidth="1.2" fill="none" />
      </g>
    );

    const PinIcon = ({ x, y, label }) => (
      <g transform={`translate(${x}, ${y})`}>
        <circle cx="0" cy="0" r="8" stroke="#2c2c2c" strokeWidth="1.5" fill="none" />
        <circle cx="0" cy="0" r="3" fill="#2c2c2c" />
        <line x1="0" y1="8" x2="0" y2="20" stroke="#2c2c2c" strokeWidth="1.5" />
        {label && (
          <text x="0" y="35" fontSize="14" textAnchor="middle" fill="#2c2c2c" fontFamily="'Courier New', monospace">
            {label}
          </text>
        )}
      </g>
    );

    // Simplified Afghanistan outline
    const AfghanistanMap = ({ x, y, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) scale(${scale})`}>
        <path
          d="M 0,20 L 15,10 L 35,8 L 55,15 L 65,8 L 75,12 L 85,8 L 95,15 L 100,25 L 95,40 L 85,50 L 70,55 L 50,52 L 30,45 L 15,35 L 5,28 Z"
          stroke="#2c2c2c"
          strokeWidth="2"
          fill="none"
          strokeLinejoin="round"
        />
      </g>
    );

    // Simplified India outline
    const IndiaMap = ({ x, y, scale = 1 }) => (
      <g transform={`translate(${x}, ${y}) scale(${scale})`}>
        <path
          d="M 40,0 L 55,5 L 65,15 L 70,30 L 75,50 L 70,70 L 65,90 L 55,110 L 45,125 L 35,135 L 25,125 L 20,110 L 15,90 L 10,70 L 15,50 L 20,30 L 30,15 L 35,5 Z M 25,140 L 20,145 L 25,150"
          stroke="#2c2c2c"
          strokeWidth="2"
          fill="none"
          strokeLinejoin="round"
        />
      </g>
    );

    // ============================================
    // MAIN COMPONENT
    // ============================================
    const LifeJourneyTimeline = () => {
      const [scrollProgress, setScrollProgress] = useState(0);
      const [selectedMilestone, setSelectedMilestone] = useState(null);
      const [showHint, setShowHint] = useState(true);
      const [reducedMotion, setReducedMotion] = useState(false);
      const containerRef = useRef(null);
      const maxScroll = 6500; // Total horizontal distance

      useEffect(() => {
        // Check for reduced motion preference
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        setReducedMotion(mediaQuery.matches);

        // Hide hint after 3 seconds
        const hintTimer = setTimeout(() => setShowHint(false), 3000);

        // Hide loading screen
        setTimeout(() => {
          const loadingEl = document.getElementById('loading');
          if (loadingEl) loadingEl.classList.add('hidden');
        }, 500);

        return () => clearTimeout(hintTimer);
      }, []);

      useEffect(() => {
        const handleWheel = (e) => {
          e.preventDefault();
          const delta = e.deltaY;
          setScrollProgress((prev) => {
            const newProgress = prev + delta * 0.5;
            return Math.max(0, Math.min(maxScroll, newProgress));
          });
        };

        const container = containerRef.current;
        if (container) {
          container.addEventListener('wheel', handleWheel, { passive: false });
        }

        return () => {
          if (container) {
            container.removeEventListener('wheel', handleWheel);
          }
        };
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (selectedMilestone !== null) {
            if (e.key === 'Escape') {
              setSelectedMilestone(null);
            }
            return;
          }

          if (e.key === 'ArrowRight') {
            setScrollProgress((prev) => Math.min(maxScroll, prev + 100));
          } else if (e.key === 'ArrowLeft') {
            setScrollProgress((prev) => Math.max(0, prev - 100));
          } else if (e.key === 'Enter') {
            const closest = milestonesData.reduce((prev, curr) => 
              Math.abs(curr.position - scrollProgress) < Math.abs(prev.position - scrollProgress) ? curr : prev
            );
            if (Math.abs(closest.position - scrollProgress) < 200) {
              setSelectedMilestone(closest);
            }
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [scrollProgress, selectedMilestone]);

      // Generate the journey path
      const generatePath = () => {
        let path = "M 100 300"; // Starting point
        
        // Path to Afghanistan/India segment
        path += " L 800 280 Q 1000 270 1200 300";
        
        // Afghanistan to India arc
        path += " Q 1400 350 1600 320 Q 1800 290 2000 310";
        
        // Continue the journey
        path += " L 2400 300 Q 2600 290 2800 310 L 3600 305";
        path += " Q 3800 300 4000 320 L 4800 315";
        path += " Q 5000 310 5200 300 L 6000 295 L 6500 290";
        
        return path;
      };

      const journeyPath = generatePath();
      const pathLength = 7000; // Approximate path length
      const drawProgress = (scrollProgress / maxScroll) * pathLength;

      // Calculate airplane position for Kabul to India segment
      const airplaneProgress = Math.max(0, Math.min(1, (scrollProgress - 1000) / 1000));
      const airplaneX = 1200 + (airplaneProgress * 800);
      const airplaneY = 300 + Math.sin(airplaneProgress * Math.PI) * 50;
      const airplaneRotation = Math.cos(airplaneProgress * Math.PI) * 15;

      const getIconComponent = (icon) => {
        switch (icon) {
          case 'airplane': return AirplaneIcon;
          case 'book': return BookIcon;
          case 'star': return StarIcon;
          case 'code': return CodeIcon;
          case 'graduation': return GraduationIcon;
          case 'university': return UniversityIcon;
          default: return StarIcon;
        }
      };

      const progressPercent = Math.round((scrollProgress / maxScroll) * 100);

      return (
        <div 
          ref={containerRef}
          className="life-journey-container"
          role="application"
          aria-label="Interactive life journey timeline"
          style={{
            width: '100vw',
            height: '100vh',
            overflow: 'hidden',
            background: '#fafafa',
            position: 'relative',
            cursor: 'grab',
            fontFamily: "'Courier New', monospace"
          }}
        >
          {/* Hint overlay */}
          {showHint && (
            <div 
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                background: 'rgba(250, 250, 250, 0.95)',
                padding: '30px 50px',
                border: '2px solid #2c2c2c',
                borderRadius: '8px',
                zIndex: 1000,
                animation: 'fadeOut 3s forwards',
                fontSize: '18px',
                textAlign: 'center'
              }}
            >
              <div style={{ marginBottom: '10px', fontSize: '24px' }}>↕️</div>
              Scroll to travel the line
              <div style={{ fontSize: '14px', marginTop: '10px', opacity: 0.7 }}>
                Use ← → arrow keys to navigate
              </div>
            </div>
          )}

          {/* Progress indicator */}
          <div 
            style={{
              position: 'absolute',
              top: '20px',
              right: '20px',
              fontSize: '16px',
              color: '#2c2c2c',
              background: 'rgba(250, 250, 250, 0.9)',
              padding: '10px 20px',
              border: '1px solid #2c2c2c',
              borderRadius: '4px',
              zIndex: 100
            }}
          >
            Progress: {progressPercent}%
          </div>

          {/* Scroll cue chevrons */}
          <div 
            style={{
              position: 'absolute',
              right: '30px',
              top: '50%',
              transform: 'translateY(-50%)',
              fontSize: '40px',
              color: '#2c2c2c',
              opacity: scrollProgress < 100 ? 0.3 : 0,
              transition: 'opacity 0.5s',
              animation: 'pulse 2s infinite'
            }}
          >
            ‹
          </div>

          {/* Main SVG Canvas */}
          <svg 
            width="100%" 
            height="100%" 
            viewBox="0 0 1400 700"
            preserveAspectRatio="xMidYMid slice"
            style={{
              filter: 'url(#pencilTexture)'
            }}
          >
            <defs>
              {/* Pencil texture filter */}
              <filter id="pencilTexture">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" />
              </filter>
            </defs>

            {/* Background elements that move with scroll */}
            <g transform={`translate(${-scrollProgress * 0.1}, 0)`}>
              {/* Subtle grid lines */}
              {[...Array(20)].map((_, i) => (
                <line 
                  key={i}
                  x1={i * 400}
                  y1="0"
                  x2={i * 400}
                  y2="700"
                  stroke="#e0e0e0"
                  strokeWidth="0.5"
                  opacity="0.3"
                />
              ))}
            </g>

            {/* Main content group that moves with scroll */}
            <g transform={`translate(${-scrollProgress}, 0)`}>
              {/* The journey line */}
              <path
                d={journeyPath}
                stroke="#2c2c2c"
                strokeWidth="2.5"
                fill="none"
                strokeLinecap="round"
                strokeLinejoin="round"
                strokeDasharray={pathLength}
                strokeDashoffset={reducedMotion ? 0 : Math.max(0, pathLength - drawProgress)}
                style={{
                  transition: reducedMotion ? 'none' : 'stroke-dashoffset 0.1s ease-out'
                }}
              />

              {/* Afghanistan and India maps during the travel segment */}
              {scrollProgress > 900 && scrollProgress < 2200 && (
                <>
                  <AfghanistanMap x={950} y={150} scale={0.8} />
                  <PinIcon x={1000} y={200} label="Kabul" />
                  
                  <IndiaMap x={1700} y={100} scale={1} />
                  <PinIcon x={1765} y={180} label="New Delhi" />

                  {/* Animated airplane */}
                  {!reducedMotion && scrollProgress > 1000 && scrollProgress < 2000 && (
                    <AirplaneIcon 
                      x={airplaneX} 
                      y={airplaneY} 
                      rotation={airplaneRotation}
                      scale={1.5}
                    />
                  )}
                </>
              )}

              {/* Milestone markers */}
              {milestonesData.map((milestone, index) => {
                const IconComponent = getIconComponent(milestone.icon);
                const isVisible = Math.abs(milestone.position - scrollProgress) < 800;
                const isNear = Math.abs(milestone.position - scrollProgress) < 200;

                return (
                  <g key={index}>
                    {isVisible && (
                      <g 
                        transform={`translate(${milestone.position}, ${295})`}
                        style={{ 
                          cursor: 'pointer',
                          opacity: isNear ? 1 : 0.6,
                          transition: 'opacity 0.3s'
                        }}
                        onClick={() => setSelectedMilestone(milestone)}
                      >
                        <line x1="0" y1="5" x2="0" y2="60" stroke="#2c2c2c" strokeWidth="1.5" />
                        <IconComponent x={0} y={-30} />
                        
                        {/* Age label */}
                        <text 
                          x="0" 
                          y="80" 
                          fontSize="16" 
                          textAnchor="middle" 
                          fill="#2c2c2c"
                          fontWeight="bold"
                        >
                          Age {milestone.age}
                        </text>

                        {/* Title */}
                        {isNear && (
                          <text 
                            x="0" 
                            y="100" 
                            fontSize="12" 
                            textAnchor="middle" 
                            fill="#2c2c2c"
                          >
                            {milestone.title}
                          </text>
                        )}
                      </g>
                    )}
                  </g>
                );
              })}
            </g>
          </svg>

          {/* Timeline navigator */}
          <div 
            style={{
              position: 'absolute',
              bottom: '30px',
              left: '50%',
              transform: 'translateX(-50%)',
              width: '80%',
              maxWidth: '800px',
              height: '50px',
              background: 'rgba(250, 250, 250, 0.95)',
              border: '2px solid #2c2c2c',
              borderRadius: '8px',
              padding: '10px 20px',
              display: 'flex',
              alignItems: 'center',
              zIndex: 100
            }}
          >
            <div style={{ flex: 1, position: 'relative', height: '10px', background: '#e0e0e0', borderRadius: '5px' }}>
              {/* Progress bar */}
              <div 
                style={{
                  position: 'absolute',
                  left: 0,
                  top: 0,
                  height: '100%',
                  width: `${progressPercent}%`,
                  background: '#2c2c2c',
                  borderRadius: '5px',
                  transition: 'width 0.1s ease-out'
                }}
              />
              
              {/* Milestone ticks */}
              {milestonesData.map((milestone, index) => (
                <div
                  key={index}
                  style={{
                    position: 'absolute',
                    left: `${(milestone.position / maxScroll) * 100}%`,
                    top: '-5px',
                    width: '2px',
                    height: '20px',
                    background: '#2c2c2c',
                    cursor: 'pointer'
                  }}
                  onClick={() => setScrollProgress(milestone.position)}
                  title={`Age ${milestone.age}: ${milestone.title}`}
                />
              ))}

              {/* Draggable handle */}
              <div
                style={{
                  position: 'absolute',
                  left: `${progressPercent}%`,
                  top: '50%',
                  transform: 'translate(-50%, -50%)',
                  width: '20px',
                  height: '20px',
                  background: '#2c2c2c',
                  borderRadius: '50%',
                  cursor: 'grab',
                  border: '2px solid #fafafa'
                }}
              />
            </div>
          </div>

          {/* Milestone detail card */}
          {selectedMilestone && (
            <div 
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                background: '#fafafa',
                border: '3px solid #2c2c2c',
                borderRadius: '12px',
                padding: '30px',
                maxWidth: '400px',
                width: '90%',
                zIndex: 1000,
                boxShadow: '8px 8px 0 rgba(0,0,0,0.1)'
              }}
              role="dialog"
              aria-labelledby="milestone-title"
            >
              <button
                onClick={() => setSelectedMilestone(null)}
                style={{
                  position: 'absolute',
                  top: '10px',
                  right: '10px',
                  background: 'none',
                  border: 'none',
                  fontSize: '24px',
                  cursor: 'pointer',
                  color: '#2c2c2c',
                  padding: '5px 10px'
                }}
                aria-label="Close"
              >
                ×
              </button>
              
              <h2 id="milestone-title" style={{ marginTop: 0, fontSize: '24px', color: '#2c2c2c' }}>
                Age {selectedMilestone.age}
              </h2>
              <h3 style={{ fontSize: '18px', color: '#555', marginTop: '5px' }}>
                {selectedMilestone.title}
              </h3>
              <p style={{ fontSize: '16px', lineHeight: '1.6', color: '#2c2c2c', marginTop: '15px' }}>
                {selectedMilestone.description}
              </p>
              
              {selectedMilestone.from && selectedMilestone.to && (
                <div style={{ marginTop: '20px', padding: '15px', background: '#f0f0f0', borderRadius: '6px' }}>
                  <div style={{ fontSize: '14px', color: '#555' }}>
                    <strong>From:</strong> {selectedMilestone.from.city}, {selectedMilestone.from.country}
                  </div>
                  <div style={{ fontSize: '14px', color: '#555', marginTop: '5px' }}>
                    <strong>To:</strong> {selectedMilestone.to.city}, {selectedMilestone.to.country}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // Render the app
    ReactDOM.createRoot(document.getElementById('root')).render(<LifeJourneyTimeline />);
  </script>
</body>
</html>
